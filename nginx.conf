server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache para imagens
    location /imagens/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cache para arquivos JS/CSS
    location ~* \.(?:css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}